<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF4F0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="היומן וההכנסות של סימה חן">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="היומן שלי">
  <meta name="format-detection" content="telephone=no">
  <title>היומן של סימה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <button id="fab" class="fab" type="button" data-action="new-appt" aria-label="טיפול חדש"></button>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button class="tab" type="button" data-action="tab" data-tab="calendar"><span class="tab-icon" data-icon="calendar"></span><span>יומן</span></button>
    <button class="tab" type="button" data-action="tab" data-tab="reminders"><span class="tab-icon" data-icon="bell"></span><span>תזכורות</span><b class="tab-badge" id="remBadge" hidden></b></button>
    <button class="tab" type="button" data-action="tab" data-tab="summary"><span class="tab-icon" data-icon="chart"></span><span>סיכומים</span></button>
    <button class="tab" type="button" data-action="tab" data-tab="clients"><span class="tab-icon" data-icon="users"></span><span>לקוחות</span></button>
    <button class="tab" type="button" data-action="tab" data-tab="prices"><span class="tab-icon" data-icon="tag"></span><span>מחירון</span></button>
  </nav>

  <div id="sheetWrap" class="sheet-wrap" aria-hidden="true">
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="dialogWrap" class="dialog-wrap" aria-hidden="true">
    <div id="dialog" class="dialog" role="alertdialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <input id="contactsFile" type="file" hidden>

  <script src="js/logic.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
